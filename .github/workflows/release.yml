name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # Everything that runs code — install, lint, build, test, pack — happens here,
  # in a job that holds no token. The publish job below only uploads the
  # tarball this job built: `npm publish` from a checkout runs prepublishOnly,
  # which is the whole dev toolchain, and it did so with `id-token: write`.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag can point at any commit. Only one that reached main through a
      # pull request — with its required checks — is released.
      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check that the tag matches the package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Nothing in this tree needs an install hook (`npm query
      # ':attr(scripts,[postinstall])'` is empty), so a hook that ran here
      # could only be somebody else's.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ni-c-imap-mcp-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Bind the npm trusted publisher to this environment (npmjs.com → package
    # settings → Trusted Publisher → Environment "npm"): npm otherwise trusts
    # the whole workflow file, and every job in it with `id-token: write` —
    # the registry job runs a downloaded binary — could publish.
    environment: npm
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — no NPM_TOKEN secret involved.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm >= 11.5.1, which Trusted Publishing requires.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # A tarball, not a directory: npm runs no lifecycle script for it, and
      # --ignore-scripts says so twice. --provenance requires a PUBLIC
      # repository; the package is scoped, so publishConfig.access in the
      # packed package.json must be "public" — npm reports a restricted
      # publish as a 404.
      - run: npm publish ./ni-c-imap-mcp-*.tgz --provenance --ignore-scripts

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          # The registry rejects a 'version' field on OCI packages — their version
          # lives in the identifier tag instead. Touch BOTH package entries.
          jq --arg v "$version" \
            '.version = $v
             | (.packages[] | select(.registryType != "oci") | .version) = $v
             | (.packages[] | select(.registryType == "oci")) |= (del(.version) | .identifier |= sub(":[^:]*$"; ":" + $v))' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '.packages[] | "\(.registryType) \(.identifier) \(.version // "-")"' server.json
      # ci.yml pushes the image in a parallel run on the same tag, so the registry's
      # ownership check would race it. Wait until GHCR actually serves the tag.
      - name: Wait for the GHCR image tag
        run: |
          version="$(node -p "require('./package.json').version")"
          token="$(curl -fsS 'https://ghcr.io/token?scope=repository:ni-c/imap-mcp:pull&service=ghcr.io' | jq -r .token)"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/ni-c/imap-mcp/manifests/$version"; then
              echo "ghcr.io/ni-c/imap-mcp:$version is available"
              exit 0
            fi
            echo "waiting for ghcr.io/ni-c/imap-mcp:$version ($i/60)"
            sleep 30
          done
          echo "Image tag $version never appeared on GHCR — is ci.yml's publish job green?" >&2
          exit 1
      - name: Install mcp-publisher
        # Pinned and checksum-verified. Everything else this repository pulls is
        # SHA- or digest-pinned; a `releases/latest` binary piped straight into
        # tar, then run with `id-token: write`, was the one exception.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          # Written here rather than read from the release: its checksums
          # file sits next to the binary in the same mutable release, so
          # whoever can replace one can replace both. A version bump updates
          # all three values together.
          MCP_PUBLISHER_SHA256_AMD64: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          MCP_PUBLISHER_SHA256_ARM64: 8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4
        run: |
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          case "$arch" in
            amd64) expected="$MCP_PUBLISHER_SHA256_AMD64" ;;
            arm64) expected="$MCP_PUBLISHER_SHA256_ARM64" ;;
            *) echo "no pinned mcp-publisher hash for $arch" >&2; exit 1 ;;
          esac
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o mcp-publisher.tar.gz "${base}/mcp-publisher_linux_${arch}.tar.gz"
          echo "${expected}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" \
            '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
